name: validate

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for obvious leaked secrets
        run: |
          set -e
          if grep -rEn "BEGIN (RSA|OPENSSH|EC) PRIVATE KEY" --include="*" . ; then
            echo "Found what looks like a private key in the repo." >&2
            exit 1
          fi
          if [ -f .env ]; then
            echo ".env should never be committed." >&2
            exit 1
          fi
